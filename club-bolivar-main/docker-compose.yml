version: '3.8'

services:
  # 1. El Backend Laravel + React (Vite ya compilado)
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Forzamos a Laravel a escuchar en todas las interfaces para que el túnel lo vea
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www
      - /var/www/node_modules
    environment:
      - APP_ENV=local
      - APP_URL=http://localhost:8000
      - FACIAL_API_URL=http://facial-api:8081

  # 2. El Servicio de Reconocimiento Facial en Python
  facial-api:
    build:
      context: ./reconocimiento
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./reconocimiento:/app
      - /app/venv

  # 3. El túnel de Cloudflare integrado (Túnel rápido de prueba)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    # Corregimos la sintaxis para que use el proxy rápido correctamente
    command: tunnel --no-autoupdate --url http://web-app:8000
    depends_on:
      - web-app